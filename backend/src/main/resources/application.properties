spring.application.name=skillswap-backend
server.port=8080

# ---- Database: H2 (in-memory, zero setup) ----
spring.datasource.url=jdbc:h2:mem:skillswap;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- To switch to PostgreSQL, comment the H2 block above and uncomment this ----
# spring.datasource.url=jdbc:postgresql://localhost:5432/skillswap
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
jwt.secret=skillswap_super_secret_key_change_this_in_production_min_256_bits
jwt.expiration.ms=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:5173

# ---- Bootstrap credits given to every new user ----
app.credits.signup-bonus=5
